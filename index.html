<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <title>لوحة متابعة شكاوى القسم - خطة</title>
  
  <style>
    :root { 
      --blue: #171717; 
      --cyan: #f2c900; 
      --yellow: #ffd500; 
      --bg: #f7f6f1; 
      --white: #ffffff; 
      --text: #171717; 
      --muted: #6b6962; 
      --border: #e4dfce; 
      --red: #c93636; 
      --green: #16856d; 
      --shadow: 0 10px 30px #17171710;
    }
    
    * { 
      box-sizing: border-box; 
    }
    
    body { 
      margin: 0; 
      font-family: "Tajawal", Tahoma, Arial, sans-serif; 
      font-weight: 500; 
      background: var(--bg); 
      color: var(--text); 
      line-height: 1.6;
    }
    
    button, input, textarea, select { 
      font: inherit;
    }
    
    button { 
      cursor: pointer; 
    }
    
    header { 
      background: var(--white); 
      padding: 14px 24px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 15px; 
      position: sticky; 
      top: 0; 
      z-index: 5;
    }
    
    .brand { 
      display: flex; 
      align-items: center; 
      gap: 12px;
    }
    
    .brand img { 
      width: 65px; 
      height: 52px; 
      object-fit: contain; 
      border-radius: 8px;
    }
    
    .brand-logo { 
      width: 150px; 
      height: 75px; 
      flex: 0 0 auto;
    }
    
    .brand-logo img { 
      display: block; 
      width: 100%; 
      height: 100%; 
      object-fit: contain;
    }
    
    .brand strong { 
      font-size: 17px; 
    }
    
    .brand small { 
      display: block; 
      color: var(--muted); 
      margin-top: 5px;
    }
    
    main { 
      max-width: 1250px; 
      margin: auto; 
      padding: 28px 22px 100px;
    }
    
    .page { 
      display: none; 
      animation: appear .3s ease;
    }
    
    .page.active { 
      display: block; 
    }
    
    @keyframes appear { 
      from { opacity: 0; transform: translateX(15px); } 
      to { opacity: 1; transform: translateX(0); }
    }
    
    .page-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 16px; 
      margin-bottom: 25px;
    }
    
    h1 { font-size: clamp(23px, 3vw, 34px); }
    h2 { font-size: 21px; }
    p { line-height: 1.8; }
    
    .muted { 
      color: var(--muted); 
    }
    
    .btn { 
      border: 0; 
      border-radius: 10px; 
      padding: 11px 16px; 
      font-weight: bold; 
      transition: .2s;
    }
    
    .btn:hover { 
      transform: translateY(-2px); 
    }
    
    .primary { 
      background: var(--blue); 
      color: white;
    }
    
    .secondary { 
      background: #e7f5ff; 
      color: var(--blue);
    }
    
    .delete { 
      background: #fff0f1; 
      color: var(--red);
    }
    
    .stats { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 14px; 
      margin: 25px 0;
    }
    
    .stat, .panel { 
      background: white; 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 20px; 
      box-shadow: 0 7px 25px #1454a40c;
    }
    
    .stat span { 
      color: var(--muted); 
      font-size: 13px;
    }
    
    .stat strong { 
      display: block; 
      font-size: 29px; 
      margin-top: 10px;
    }
    
    .teacher-grid, .problem-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); 
      gap: 16px;
    }
    
    .teacher { 
      position: relative; 
      text-align: center; 
      background: white; 
      padding: 20px; 
      border: 1px solid var(--border); 
      border-radius: 17px; 
      transition: .2s;
    }
    
    .teacher:hover, .problem:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 10px 25px #1454a416;
    }
    
    .avatar { 
      width: 85px; 
      height: 85px; 
      border-radius: 50%; 
      margin: auto auto 12px; 
      background: #e7f5ff; 
      border: 3px solid white; 
      box-shadow: 0 0 0 1px var(--border); 
      display: grid; 
      place-items: center; 
      font-size: 29px; 
      color: var(--blue); 
      overflow: hidden; 
      cursor: pointer;
    }
    
    .avatar img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
    }
    
    .teacher h3 { margin: 8px 0; }
    .teacher p { font-size: 13px; color: var(--muted); }
    
    .status { 
      display: inline-block; 
      padding: 6px 10px; 
      border-radius: 20px; 
      background: #fff3dc; 
      color: #946000; 
      font-size: 12px;
    }
    
    .problem { 
      text-align: right; 
      background: white; 
      border: 1px solid var(--border); 
      border-right: 4px solid var(--cyan); 
      border-radius: 14px; 
      padding: 19px; 
      min-height: 150px; 
      transition: .2s; 
      color: var(--text);
    }
    
    .problem h3 { margin-top: 5px; }
    .problem p { color: var(--muted); font-size: 13px; }
    
    .problem .impact { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      padding: 5px 9px; 
      background: #fff3dc; 
      border-radius: 20px; 
      font-size: 12px;
    }
    
    .problem .impact-icon { 
      font-size: 22px; 
      font-weight: bold; 
      line-height: 1;
    }
    
    .problem .impact-high { background: #fff0f0; color: #c93636; }
    .problem .impact-medium { background: #fff6d6; color: #d99b00; }
    .problem .impact-low { background: #e8f6ed; color: #16856d; }
    .problem h3 { margin: 0; }
    
    .problem-grid { 
      grid-template-columns: repeat(auto-fill, minmax(180px, 200px)); 
      justify-content: start;
    }
    
    .problem-grid .problem { 
      position: relative; 
      isolation: isolate; 
      display: grid; 
      grid-template-rows: 1fr auto; 
      justify-items: center; 
      gap: 10px; 
      aspect-ratio: 1; 
      min-height: 0; 
      padding: 14px; 
      border: 1px solid #343434; 
      border-radius: 28px; 
      background: white; 
      box-shadow: 7px 0 0 var(--yellow);
    }
    
    .problem-grid .problem .impact { 
      display: grid; 
      place-items: center; 
      width: 88px; 
      height: 78px; 
      padding: 0; 
      flex: 0 0 auto; 
      background: #f2c900; 
      color: #171717; 
      clip-path: polygon(50% 0, 100% 100%, 0 100%); 
      filter: drop-shadow(0 4px 3px #17171730);
    }
    
    .problem-grid .problem .impact.impact-high { background: #dc3838; color: white; }
    .problem-grid .problem .impact.impact-medium { background: #f2c900; color: #171717; }
    .problem-grid .problem .impact.impact-low { background: #29a36a; color: white; }
    
    .problem-grid .problem .impact-icon { 
      position: relative; 
      width: 7px; 
      height: 27px; 
      margin-top: 9px; 
      border-radius: 5px; 
      background: currentColor;
    }
    
    .problem-grid .problem .impact-icon::after { 
      position: absolute; 
      right: 0; 
      bottom: -12px; 
      width: 7px; 
      height: 7px; 
      border-radius: 50%; 
      background: currentColor; 
      content: "";
    }
    
    .problem-grid .problem h3 { 
      width: 100%; 
      margin: 0; 
      padding: 5px 8px; 
      border: 1px solid #343434; 
      border-radius: 7px; 
      background: white; 
      color: var(--text); 
      text-align: center; 
      font-size: 15px; 
      line-height: 1.4;
    }
    
    .empty { 
      grid-column: 1 / -1; 
      background: white; 
      border: 1px dashed #b9cde6; 
      border-radius: 14px; 
      text-align: center; 
      padding: 35px; 
      color: var(--muted);
    }
    
    /* التنقل بين الصفحات */
    .navigation { 
      position: fixed; 
      bottom: 16px; 
      left: 50%; 
      transform: translateX(-50%); 
      display: flex; 
      gap: 7px; 
      background: var(--blue); 
      padding: 7px; 
      border-radius: 15px; 
      box-shadow: 0 8px 30px #1454a44a; 
      z-index: 10;
    }
    
    .navigation button { 
      border: 0; 
      padding: 12px 16px; 
      background: transparent; 
      color: white; 
      border-radius: 10px;
    }
    
    .navigation button.active { 
      background: white; 
      color: var(--blue); 
      font-weight: bold;
    }
    
    /* النوافذ المنبثقة */
    .modal { 
      position: fixed; 
      inset: 0; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      background: #102c5077; 
      padding: 15px; 
      z-index: 20;
    }
    
    .modal.show { 
      display: flex; 
    }
    
    .modal-box { 
      background: white; 
      width: min(650px, 100%); 
      max-height: 90vh; 
      overflow-y: auto; 
      border-radius: 20px; 
      padding: 24px; 
      box-shadow: 0 20px 60px #102c5033;
    }
    
    .modal-head { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 10px;
    }
    
    .close { 
      border: 0; 
      background: #eef5fc; 
      border-radius: 9px; 
      width: 36px; 
      height: 36px; 
      font-size: 22px; 
      color: var(--blue);
    }
    
    .form-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 14px;
    }
    
    .field { 
      display: flex; 
      flex-direction: column; 
      gap: 7px;
    }
    
    .field.full { 
      grid-column: 1 / -1; 
    }
    
    .field label { 
      font-size: 13px; 
      font-weight: bold;
    }
    
    .field input, .field textarea, .field select { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      background: #fbfdff;
