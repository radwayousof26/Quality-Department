<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECQ Report Builder - Elkheta</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Yellow action buttons use white text and a thin black outline. */
    button[class*="bg-yellow"], button[class*="bg-amber"], a[class*="bg-yellow"], a[class*="bg-amber"] {
      color: #fff !important;
      border: 1px solid #171717 !important;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <img src="https://logopng-omega.vercel.app/file.png" alt="Elkheta Logo" class="h-12 w-auto object-contain" onerror="this.src='https://placehold.co/140x50?text=Elkheta'">
        <div class="h-8 w-px bg-slate-300 hidden sm:block"></div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
            <span>ECQ Report Builder</span>
            <span class="text-xs bg-sky-100 text-sky-800 font-medium px-2 py-0.5 rounded-full border border-sky-200">v1.3</span>
          </h1>
          <p class="text-xs text-slate-500">Elkheta Educational Content Quality</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="downloadReport()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all flex items-center gap-2 text-sm">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <span>Download HTML Report</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- LEFT PANEL: Inputs & Form -->
    <div class="lg:col-span-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
      
      <!-- Report Type Selector Tabs -->
      <div class="flex bg-slate-100 p-1.5 rounded-xl">
        <button id="tabTeacherBtn" onclick="switchTab('teacher')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 bg-white text-sky-700 shadow-sm">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span>Course Assessment</span>
        </button>
        <button id="tabMeetingBtn" onclick="switchTab('meeting')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-clipboard-check"></i>
          <span>Quality Report</span>
        </button>
      </div>

      <!-- FORM FIELDS -->
      <form id="reportForm" oninput="updateLivePreview()" class="space-y-5">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div id="reportedByFieldContainer">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Reported By</label>
            <input type="text" id="reportedBy" dir="auto" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="e.g. Quality Assurance Team">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Created By</label>
            <input type="text" id="createdBy" dir="auto" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="e.g. Ahmed Mostafa">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Report Date</label>
            <input type="date" id="reportDate" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Grade / Year</label>
            <input type="text" id="grade" dir="auto" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="e.g. Grade 11 - Secondary 2">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Subject</label>
            <input type="text" id="subject" dir="auto" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="e.g. Mathematics - Pure Calculus">
          </div>
        </div>

        <!-- TEACHER DETAILS (For Course Assessment) -->
        <div id="teacherDetailsSection" class="p-4 bg-sky-50/60 rounded-xl border border-sky-100 space-y-4">
          <h3 class="text-xs font-bold uppercase tracking-wider text-sky-800 flex items-center gap-1.5">
            <i class="fa-solid fa-id-badge"></i> Teacher Identification
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-700 mb-1">Teacher Full Name</label>
              <input type="text" id="teacherName" dir="auto" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white" placeholder="e.g. Mr. Mohamed El-Sayed">
            </div>
            
            <div class="sm:col-span-2 space-y-2">
              <label class="block text-xs font-medium text-slate-700">Teacher Photo / Avatar</label>
              <div class="flex items-center gap-4 flex-wrap">
                <label class="cursor-pointer bg-white border border-slate-300 hover:border-sky-500 rounded-lg px-3 py-2 text-xs font-semibold text-slate-700 transition flex items-center gap-2 shadow-sm">
                  <i class="fa-solid fa-camera text-sky-600"></i>
                  <span>Upload Photo</span>
                  <input type="file" id="teacherPhotoUpload" accept="image/*" class="hidden" onchange="handleTeacherPhotoUpload(event)">
                </label>
                
                <span class="text-xs text-slate-400">or default avatar:</span>
                
                <div class="flex gap-2">
                  <button type="button" onclick="setAvatarPreset('male')" class="avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-sky-400 bg-sky-100 text-sky-800 font-semibold" id="btnAvatarMale">
                    <i class="fa-solid fa-user-tie"></i> Male
                  </button>
                  <button type="button" onclick="setAvatarPreset('female')" class="avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-slate-300 bg-white text-slate-700 hover:bg-slate-50" id="btnAvatarFemale">
                    <i class="fa-solid fa-user"></i> Female
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ACTION REQUIRED (Auto RTL/LTR) -->
        <div id="actionRequiredSection" class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-rose-700 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-exclamation"></i> Action Required
          </label>
          <textarea id="actionRequired" dir="auto" rows="3" class="w-full text-sm rounded-lg border-rose-200 bg-rose-50/30 border px-3 py-2 focus:ring-2 focus:ring-rose-500 focus:outline-none placeholder-slate-400" placeholder="Specify critical actions, next steps, department follow-ups..."></textarea>
        </div>

        <!-- REPORT DESCRIPTION (Auto RTL/LTR) -->
        <div class="space-y-3 pt-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-paragraph"></i> Report Description
          </label>
          <textarea id="reportDescription" dir="auto" rows="5" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2.5 focus:ring-2 focus:ring-sky-500 focus:outline-none placeholder-slate-400 leading-relaxed" placeholder="Write report observations, details, evaluation notes (Supports Arabic & English with automatic alignment)..."></textarea>

          <!-- Upload Dropzone -->
          <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center bg-slate-50/50 hover:bg-slate-50 transition cursor-pointer relative">
            <input type="file" id="mediaUploadInput" multiple accept="image/*,audio/*,video/*,application/pdf,.html,.htm" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleMultipleMediaUpload(event)">
            <div class="flex flex-col items-center justify-center space-y-1.5">
              <div class="w-10 h-10 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center">
                <i class="fa-solid fa-photo-film text-lg"></i>
              </div>
              <p class="text-xs font-semibold text-slate-700">Click or Drag & Drop Media & Documents</p>
              <p class="text-[11px] text-slate-500">Supports: Images, Audio Voice Notes, MP4 Videos, PDFs, & HTML files</p>
            </div>
          </div>

          <!-- Staged Media Files List -->
          <div id="stagedMediaContainer" class="space-y-2 mt-2"></div>
        </div>

      </form>
    </div>

    <!-- RIGHT PANEL: Live Report Preview -->
    <div class="lg:col-span-6 bg-slate-200/70 p-4 rounded-2xl border border-slate-300/80 sticky top-28">
      <div class="flex items-center justify-between pb-3 px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          Live Visual Report Preview
        </h2>
        <span class="text-xs font-medium text-slate-500">Interactive live output</span>
      </div>

      <!-- Live Render Container -->
      <div id="reportPreviewContainer" class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden max-h-[80vh] overflow-y-auto">
        <!-- Live content dynamically injected via JS -->
      </div>
    </div>

  </main>

  <!-- Interactive Global Media Modal for Dashboard Preview -->
  <div id="mediaModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col border border-slate-800">
      <div class="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5 truncate">
          <i id="modalIcon" class="fa-solid fa-eye text-sky-400"></i>
          <span id="modalTitle" class="text-sm font-semibold truncate">Media Preview</span>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white transition w-8 h-8 rounded-lg flex items-center justify-center hover:bg-slate-800">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modalBody" class="p-4 overflow-auto flex-1 flex items-center justify-center bg-slate-950/50 min-h-[300px]">
        <!-- Dynamic Modal Content -->
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'teacher';
    let teacherPhotoData = null;
    let currentAvatarPreset = 'male';
    let mediaFiles = [];

    const defaultAvatars = {
      male: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230284c7'/><circle cx='50' cy='36' r='18' fill='%23ffffff'/><path d='M20 86 c0-20 14-32 30-32 s30 12 30 32' fill='%23ffffff'/></svg>",
      female: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230d9488'/><circle cx='50' cy='37' r='17' fill='%23ffffff'/><path d='M24 88 c0-18 12-28 26-28 s26 10 26 28' fill='%23ffffff'/><path d='M35 38 C35 24 65 24 65 38' stroke='%230d9488' stroke-width='4' fill='none'/></svg>"
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
      updateLivePreview();
    });

    function switchTab(type) {
      currentTab = type;
      const tabTeacherBtn = document.getElementById('tabTeacherBtn');
      const tabMeetingBtn = document.getElementById('tabMeetingBtn');
      const teacherDetailsSection = document.getElementById('teacherDetailsSection');
      const actionRequiredSection = document.getElementById('actionRequiredSection');
      const reportedByFieldContainer = document.getElementById('reportedByFieldContainer');

      if (type === 'teacher') {
        tabTeacherBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 bg-white text-sky-700 shadow-sm";
        tabMeetingBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900";
        teacherDetailsSection.classList.remove('hidden');
        actionRequiredSection.classList.remove('hidden');
        reportedByFieldContainer.classList.remove('hidden');
      } else {
        tabMeetingBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 bg-white text-sky-700 shadow-sm";
        tabTeacherBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900";
        teacherDetailsSection.classList.add('hidden');
        actionRequiredSection.classList.add('hidden');
        reportedByFieldContainer.classList.add('hidden');
      }
      updateLivePreview();
    }

    function setAvatarPreset(gender) {
      currentAvatarPreset = gender;
      teacherPhotoData = null;
      const btnMale = document.getElementById('btnAvatarMale');
      const btnFemale = document.getElementById('btnAvatarFemale');

      if (gender === 'male') {
        btnMale.className = "avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-sky-400 bg-sky-100 text-sky-800 font-semibold";
        btnFemale.className = "avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-slate-300 bg-white text-slate-700 hover:bg-slate-50";
      } else {
        btnFemale.className = "avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-teal-400 bg-teal-100 text-teal-800 font-semibold";
        btnMale.className = "avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-slate-300 bg-white text-slate-700 hover:bg-slate-50";
      }
      updateLivePreview();
    }

    function handleTeacherPhotoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          teacherPhotoData = e.target.result;
          document.getElementById('btnAvatarMale').className = "avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-slate-300 bg-white text-slate-700";
          document.getElementById('btnAvatarFemale').className = "avatar-opt-btn px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 border-slate-300 bg-white text-slate-700";
          updateLivePreview();
        };
        reader.readAsDataURL(file);
      }
    }

    function handleMultipleMediaUpload(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        const fileType = determineFileType(file);
        reader.onload = (e) => {
          mediaFiles.push({
            id: 'media_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            name: file.name,
            size: (file.size / 1024).toFixed(1) + ' KB',
            type: fileType,
            mimeType: file.type,
            dataUrl: e.target.result
          });
          renderStagedMediaList();
          updateLivePreview();
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function determineFileType(file) {
      if (file.type.startsWith('image/')) return 'image';
      if (file.type.startsWith('audio/')) return 'audio';
      if (file.type.startsWith('video/')) return 'video';
      if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) return 'pdf';
      if (file.type.includes('html') || file.name.endsWith('.html') || file.name.endsWith('.htm')) return 'html';
      return 'other';
    }

    function removeMedia(id) {
      mediaFiles = mediaFiles.filter(item => item.id !== id);
      renderStagedMediaList();
      updateLivePreview();
    }

    function renderStagedMediaList() {
      const container = document.getElementById('stagedMediaContainer');
      if (mediaFiles.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = mediaFiles.map(file => {
        let iconClass = 'fa-file text-slate-400';
        if (file.type === 'image') iconClass = 'fa-file-image text-emerald-500';
        if (file.type === 'audio') iconClass = 'fa-file-audio text-amber-500';
        if (file.type === 'video') iconClass = 'fa-file-video text-rose-500';
        if (file.type === 'pdf') iconClass = 'fa-file-pdf text-red-500';
        if (file.type === 'html') iconClass = 'fa-file-code text-sky-500';

        return `
          <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-200 text-xs">
            <div class="flex items-center gap-2 truncate pr-2">
              <i class="fa-solid ${iconClass}"></i>
              <span class="font-medium text-slate-700 truncate">${file.name}</span>
              <span class="text-slate-400">(${file.size})</span>
            </div>
            <button type="button" onclick="removeMedia('${file.id}')" class="text-slate-400 hover:text-red-500 transition px-1">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function openMediaModal(fileId) {
      const file = mediaFiles.find(m => m.id === fileId);
      if (!file) return;

      const modal = document.getElementById('mediaModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalIcon = document.getElementById('modalIcon');
      const modalBody = document.getElementById('modalBody');

      modalTitle.textContent = file.name;
      modalBody.innerHTML = '';

      if (file.type === 'image') {
        modalIcon.className = "fa-solid fa-file-image text-emerald-400";
        modalBody.innerHTML = `<img src="${file.dataUrl}" alt="${file.name}" class="max-h-[75vh] w-auto max-w-full object-contain rounded-lg shadow-lg">`;
      } else if (file.type === 'audio') {
        modalIcon.className = "fa-solid fa-file-audio text-amber-400";
        modalBody.innerHTML = `
          <div class="bg-white p-6 rounded-2xl w-full max-w-md shadow-xl text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-2xl">
              <i class="fa-solid fa-headphones"></i>
            </div>
            <p class="text-sm font-bold text-slate-800">${file.name}</p>
            <audio controls autoplay class="w-full">
              <source src="${file.dataUrl}" type="${file.mimeType}">
            </audio>
          </div>
        `;
      } else if (file.type === 'video') {
        modalIcon.className = "fa-solid fa-file-video text-rose-400";
        modalBody.innerHTML = `
          <video controls autoplay class="max-h-[75vh] w-auto max-w-full rounded-xl shadow-xl bg-black">
            <source src="${file.dataUrl}" type="${file.mimeType}">
          </video>
        `;
      } else if (file.type === 'pdf') {
        modalIcon.className = "fa-solid fa-file-pdf text-red-400";
        modalBody.innerHTML = `
          <iframe src="${file.dataUrl}#toolbar=1" class="w-full h-[75vh] rounded-xl border border-slate-700 bg-white"></iframe>
        `;
      } else if (file.type === 'html') {
        modalIcon.className = "fa-solid fa-file-code text-sky-400";
        modalBody.innerHTML = `
          <iframe src="${file.dataUrl}" class="w-full h-[75vh] rounded-xl border border-slate-700 bg-white" sandbox="allow-scripts allow-same-origin"></iframe>
        `;
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('mediaModal');
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = '';
      modal.classList.add('hidden');
    }

    document.getElementById('mediaModal').addEventListener('click', (e) => {
      if (e.target.id === 'mediaModal') closeModal();
    });

    // Build the Report HTML with auto-direction detection
    function generateReportHTMLString(isForDownload = false) {
      const reportedBy = document.getElementById('reportedBy').value || 'QA Team';
      const createdBy = document.getElementById('createdBy').value || 'Department Officer';
      const reportDate = document.getElementById('reportDate').value || new Date().toISOString().split('T')[0];
      const subject = document.getElementById('subject').value || 'General Curriculum';
      const grade = document.getElementById('grade').value || 'Unspecified Grade';
      const teacherName = document.getElementById('teacherName').value || 'Teacher Not Specified';
      const actionRequired = document.getElementById('actionRequired').value;
      const reportDescription = document.getElementById('reportDescription').value || 'No description provided for this report.';

      const avatarSrc = teacherPhotoData || defaultAvatars[currentAvatarPreset];

      // Media Section with Interactive Hover and Modal Preview
      let mediaPreviewHTML = '';
      if (mediaFiles.length > 0) {
        mediaPreviewHTML = `
          <div class="mt-8 border-t border-slate-200 pt-6">
            <div class="flex items-center justify-between mb-4">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-paperclip text-sky-600"></i> Evidence & Attached Media (${mediaFiles.length})
              </h4>
              <span class="text-[11px] text-slate-400 italic">Click on any item for interactive preview</span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
              ${mediaFiles.map(file => {
                let badgeColor = 'bg-slate-100 text-slate-600';
                let iconClass = 'fa-file';
                let typeLabel = 'Document';

                if (file.type === 'image') {
                  badgeColor = 'bg-emerald-100 text-emerald-800';
                  iconClass = 'fa-image text-emerald-600';
                  typeLabel = 'Image';
                } else if (file.type === 'audio') {
                  badgeColor = 'bg-amber-100 text-amber-800';
                  iconClass = 'fa-microphone text-amber-600';
                  typeLabel = 'Voice Note';
                } else if (file.type === 'video') {
                  badgeColor = 'bg-rose-100 text-rose-800';
                  iconClass = 'fa-video text-rose-600';
                  typeLabel = 'Video';
                } else if (file.type === 'pdf') {
                  badgeColor = 'bg-red-100 text-red-800';
                  iconClass = 'fa-file-pdf text-red-600';
                  typeLabel = 'PDF Document';
                } else if (file.type === 'html') {
                  badgeColor = 'bg-sky-100 text-sky-800';
                  iconClass = 'fa-code text-sky-600';
                  typeLabel = 'HTML File';
                }

                const thumb = file.type === 'image' 
                  ? `<div class="h-28 w-full overflow-hidden bg-slate-100 relative">
                      <img src="${file.dataUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">

                      </div>
                     </div>`
                  : `<div class="h-24 w-full bg-slate-50 flex flex-col items-center justify-center group-hover:bg-slate-100 transition relative">
                      <i class="fa-solid ${iconClass} text-2xl mb-1"></i>
                      <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">${typeLabel}</span>
                      <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-semibold gap-1.5 rounded-t-xl">
                        <i class="fa-solid fa-expand"></i> Interactive Preview
                      </div>
                     </div>`;

                return `
                  <div onclick="openMediaModal('${file.id}')" class="group bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md hover:border-sky-300 transition cursor-pointer flex flex-col">
                    ${thumb}
                    <div class="p-2.5 flex-1 flex flex-col justify-between border-t border-slate-100">
                      <p class="text-xs font-semibold text-slate-800 truncate" title="${file.name}">${file.name}</p>
                      <div class="flex items-center justify-between mt-2 pt-1 border-t border-slate-50 text-[10px]">
                        <span class="font-medium px-1.5 py-0.5 rounded ${badgeColor}">${typeLabel}</span>
                        <span class="text-slate-400 font-mono">${file.size}</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // Action Required Block with dir="auto"
      let actionRequiredBlock = '';
      if (currentTab === 'teacher' && actionRequired && actionRequired.trim() !== '') {
        actionRequiredBlock = `
          <div class="my-6 p-4 rounded-xl bg-rose-50 border-l-4 border-rose-500 text-rose-900">
            <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-rose-800 mb-1.5">
              <i class="fa-solid fa-triangle-exclamation"></i> Action Required / Next Steps
            </div>
            <p dir="auto" class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(actionRequired)}</p>
          </div>
        `;
      }

      // Teacher Identity Block
      let teacherIdentityBlock = '';
      if (currentTab === 'teacher') {
        teacherIdentityBlock = `
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 flex items-center gap-4 mb-6">
            <img src="${avatarSrc}" alt="Teacher Avatar" class="w-14 h-14 rounded-full object-cover border-2 border-white shadow-sm ring-2 ring-sky-200">
            <div>
              <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Teacher</p>
              <h3 dir="auto" class="text-base font-bold text-slate-900">${escapeHtml(teacherName)}</h3>
              <p dir="auto" class="text-xs text-slate-500">${escapeHtml(subject)} • ${escapeHtml(grade)}</p>
            </div>
          </div>
        `;
      }

      // Full HTML Report Layout
      return `
        <div class="p-6 sm:p-8 bg-white font-sans text-slate-800">
          <!-- Report Header -->
          <div class="flex items-start justify-between border-b border-slate-200 pb-5 mb-6">
            <div class="flex items-center gap-3">
              <img src="https://logopng-omega.vercel.app/file.png" alt="Logo" class="h-11 w-auto object-contain" onerror="this.src='https://placehold.co/120x40?text=Elkheta'">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-sky-600 block">Elkheta Educational Content Quality</span>
                <h1 class="text-xl font-extrabold text-slate-900">${currentTab === 'teacher' ? 'Course Assessment Report' : 'Quality Report'}</h1>
              </div>
            </div>
            
            <!-- Badge & Date Directly Below -->
            <div class="flex flex-col items-end">
              <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${currentTab === 'teacher' ? 'bg-sky-100 text-sky-800 border border-sky-200' : 'bg-purple-100 text-purple-800 border border-purple-200'}">
                ${currentTab === 'teacher' ? 'Academic Review' : 'Quality Review'}
              </span>
              <span class="text-xs font-semibold text-slate-500 mt-1.5 font-mono tracking-tight">${reportDate}</span>
            </div>
          </div>

          <!-- Metadata Badges -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 p-3 bg-slate-50/80 rounded-xl border border-slate-200/80 text-xs mb-6">
            ${currentTab === 'teacher' ? `
            <div>
              <span class="text-slate-400 block text-[10px] uppercase font-bold">Reported By</span>
              <span dir="auto" class="font-semibold text-slate-700 block truncate">${escapeHtml(reportedBy)}</span>
            </div>
            ` : ''}
            <div>
              <span class="text-slate-400 block text-[10px] uppercase font-bold">Created By</span>
              <span dir="auto" class="font-semibold text-slate-700 block truncate">${escapeHtml(createdBy)}</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px] uppercase font-bold">Subject</span>
              <span dir="auto" class="font-semibold text-slate-700 block truncate">${escapeHtml(subject)}</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px] uppercase font-bold">Grade</span>
              <span dir="auto" class="font-semibold text-slate-700 block truncate">${escapeHtml(grade)}</span>
            </div>
          </div>

          <!-- Teacher profile -->
          ${teacherIdentityBlock}

          <!-- Description Section with Intelligent Direction Detection (dir="auto") -->
          <div class="space-y-2">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500">Report Description</h4>
            <div dir="auto" class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap bg-slate-50/60 p-4 rounded-xl border border-slate-100 shadow-inner">
              ${escapeHtml(reportDescription)}
            </div>
          </div>

          <!-- Action Required Section -->
          ${actionRequiredBlock}

          <!-- Media Section with Click-to-preview Grid -->
          ${mediaPreviewHTML}

          <!-- Footer Signature -->
          <div class="mt-12 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span>Generated securely by ECQ Report Builder</span>
            <span>Elkheta Educational Content Quality</span>
          </div>
        </div>
      `;
    }

    function updateLivePreview() {
      const container = document.getElementById('reportPreviewContainer');
      container.innerHTML = generateReportHTMLString(false);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Download Standalone Self-contained HTML file
    function downloadReport() {
      const reportBodyContent = generateReportHTMLString(true);
      const subject = document.getElementById('subject').value || 'Report';
      const cleanFileName = (currentTab === 'teacher' ? 'Course_Assessment_' : 'Quality_Report_') + 
                            subject.replace(/[^a-zA-Z0-9]/g, '_') + '_' + 
                            new Date().toISOString().split('T')[0] + '.html';

      const serializedMedia = JSON.stringify(mediaFiles);

      const fullHTMLDocument = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${currentTab === 'teacher' ? 'Course Assessment Report' : 'Quality Report'} - Elkheta</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 sm:p-8 font-sans min-h-screen flex flex-col items-center">
  <div class="max-w-4xl w-full mb-4 no-print flex justify-end gap-2">
    <button onclick="window.print()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
      <i class="fa-solid fa-print"></i> Print / Save as PDF
    </button>
  </div>
  <div class="max-w-4xl w-full rounded-2xl shadow-xl overflow-hidden border border-slate-200 bg-white">
    ${reportBodyContent}
  </div>

  <!-- Standalone Interactive Modal in Exported Report -->
  <div id="mediaModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col border border-slate-800">
      <div class="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5 truncate">
          <i id="modalIcon" class="fa-solid fa-eye text-sky-400"></i>
          <span id="modalTitle" class="text-sm font-semibold truncate">Media Preview</span>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white transition w-8 h-8 rounded-lg flex items-center justify-center hover:bg-slate-800">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modalBody" class="p-4 overflow-auto flex-1 flex items-center justify-center bg-slate-950/50 min-h-[300px]"></div>
    </div>
  </div>

  <script>
    const embeddedMedia = ${serializedMedia};

    function openMediaModal(fileId) {
      const file = embeddedMedia.find(m => m.id === fileId);
      if (!file) return;

      const modal = document.getElementById('mediaModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalIcon = document.getElementById('modalIcon');
      const modalBody = document.getElementById('modalBody');

      modalTitle.textContent = file.name;
      modalBody.innerHTML = '';

      if (file.type === 'image') {
        modalIcon.className = "fa-solid fa-file-image text-emerald-400";
        modalBody.innerHTML = '<img src="' + file.dataUrl + '" class="max-h-[75vh] w-auto max-w-full object-contain rounded-lg shadow-lg">';
      } else if (file.type === 'audio') {
        modalIcon.className = "fa-solid fa-file-audio text-amber-400";
        modalBody.innerHTML = '<div class="bg-white p-6 rounded-2xl w-full max-w-md shadow-xl text-center space-y-4">' +
          '<div class="w-16 h-16 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-headphones"></i></div>' +
          '<p class="text-sm font-bold text-slate-800">' + file.name + '</p>' +
          '<audio controls autoplay class="w-full"><source src="' + file.dataUrl + '" type="' + file.mimeType + '"></audio>' +
        '</div>';
      } else if (file.type === 'video') {
        modalIcon.className = "fa-solid fa-file-video text-rose-400";
        modalBody.innerHTML = '<video controls autoplay class="max-h-[75vh] w-auto max-w-full rounded-xl shadow-xl bg-black">' +
          '<source src="' + file.dataUrl + '" type="' + file.mimeType + '">' +
        '</video>';
      } else if (file.type === 'pdf') {
        modalIcon.className = "fa-solid fa-file-pdf text-red-400";
        modalBody.innerHTML = '<iframe src="' + file.dataUrl + '#toolbar=1" class="w-full h-[75vh] rounded-xl border border-slate-700 bg-white"></iframe>';
      } else if (file.type === 'html') {
        modalIcon.className = "fa-solid fa-file-code text-sky-400";
        modalBody.innerHTML = '<iframe src="' + file.dataUrl + '" class="w-full h-[75vh] rounded-xl border border-slate-700 bg-white" sandbox="allow-scripts allow-same-origin"></iframe>';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('mediaModal');
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = '';
      modal.classList.add('hidden');
    }

    document.getElementById('mediaModal').addEventListener('click', (e) => {
      if (e.target.id === 'mediaModal') closeModal();
    });
  <\/script>
</body>
</html>`;

      const blob = new Blob([fullHTMLDocument], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = cleanFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
